/*
 * Icinga 2 checks for an Ollama cluster behind Olla or llm-head.
 *
 * Install both plugins on the head host (they need no privileges):
 *   /usr/local/lib/nagios/plugins/custom/check_llm_balancer_errors
 *   /usr/local/lib/nagios/plugins/custom/check_ollama_models
 *
 * Put the CheckCommands in a global zone and the Services in the master zone. The
 * CheckCommands must be in a global zone: every service runs on the head host through
 * command_endpoint, and that endpoint only knows commands synced to it from a global
 * zone. The head host runs them because that's where the balancer is, and it can reach
 * every GPU host.
 *
 * Host vars used:
 *   head host:  vars.llm_balancers = { "olla" = "http://127.0.0.1:40114", ... }
 *   GPU hosts:  vars.ollama_url = "http://gpu1.lan:11434"
 *               vars.ollama_probe_models = [ "llama3.2:3b" ]   (small, always probed)
 *   both:       vars.client_endpoint = "<head endpoint name>"
 */

object CheckCommand "llm_balancer_errors" {
  command = [ "/usr/local/lib/nagios/plugins/custom/check_llm_balancer_errors" ]
  arguments = {
    "--url" = "$llm_url$"
    "--name" = "$llm_name$"
    "-w" = "$llm_warn$"
    "-c" = "$llm_crit$"
  }
  vars.llm_warn = 1
  vars.llm_crit = 5
}

object CheckCommand "ollama_models" {
  command = [ "/usr/local/lib/nagios/plugins/custom/check_ollama_models" ]
  timeout = 3m
  arguments = {
    "--host" = "$ollama_url$"
    "--model" = { value = "$ollama_probe_models$"; repeat_key = true }
    "--loaded" = { set_if = true }
    "--timeout" = "$ollama_probe_timeout$"
  }
  vars.ollama_probe_timeout = 45
}

/* Alert on the first check interval with client-visible failures. */
apply Service "llm-errors-" for (name => url in host.vars.llm_balancers) {
  import "generic-service"
  check_command = "llm_balancer_errors"
  command_endpoint = host.vars.client_endpoint
  check_interval = 5m
  retry_interval = 5m
  max_check_attempts = 1
  vars.llm_name = name
  vars.llm_url = url
}

/* A GPU host that answers HTTP but can't load or serve a model is CRITICAL. Two
 * attempts, so one slow cold load doesn't page. */
apply Service "ollama-models" {
  import "generic-service"
  check_command = "ollama_models"
  command_endpoint = host.vars.client_endpoint
  check_interval = 5m
  retry_interval = 2m
  max_check_attempts = 2
  assign where host.vars.ollama_url
}
