[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-head"
version = "0.1.0.dev0"
description = "Load balancer for self-hosted Ollama clusters that knows which models each GPU host has loaded. Drop-in replacement for Olla."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
llm-head = "llm_head.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_head"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
